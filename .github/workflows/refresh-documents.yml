name: 정책계획 수집 (매일)

# 매일 새벽 5시(KST)에 16개 시도교육청 게시판을 수집한다.
# GitHub Actions는 UTC 기준이므로 20:00 UTC = 05:00 KST(+9)
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      office:
        description: "특정 교육청만 수집 (비우면 전체). 예: seoul, jeonbuk"
        required: false
        default: ""

# 커밋 푸시 권한
permissions:
  contents: write

concurrency:
  group: collect-documents
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # 게시판 150여 개 · 정중한 요청간격 고려

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium   # 정보공개포털 수집용

      - name: 수집 전 건수 기록
        id: before
        run: |
          if [ -f data/documents.json ]; then
            echo "count=$(python -c "import json;print(json.load(open('data/documents.json',encoding='utf-8'))['count'])")" >> $GITHUB_OUTPUT
          else
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: 정책계획 수집
        # 입력값은 env 로 넘긴다. run: 에 직접 끼워 넣으면 셸이 그대로 실행해 버린다.
        env:
          OFFICE: ${{ inputs.office }}
        run: |
          if [ -n "$OFFICE" ]; then
            python scripts/collect_documents.py --office "$OFFICE"
          else
            python scripts/collect_documents.py
          fi

      - name: 내부결재 계획 수집 (증분)
        # 정보공개포털 정보목록+원문정보에서 각 교육청 본청이 결재한 계획을 수집(최근 5일).
        # 실패해도 게시판 수집 결과는 살리기 위해 continue-on-error.
        #
        # ※ 원본(data/infolist_raw.json)은 저장소에 없다(.gitignore). Actions에서는
        #   매번 화면용 파일에 이어붙는 형태가 되므로, 필터를 고쳤을 때의 전면
        #   재적용은 로컬에서 --refilter 로 한 뒤 커밋한다.
        continue-on-error: true
        run: python scripts/collect_infolist.py --days 5

      - name: 수집 결과 검증 (급감 감지)
        id: verify
        run: |
          python - <<'PY'
          import json, os, sys
          d = json.load(open('data/documents.json', encoding='utf-8'))
          before = int("${{ steps.before.outputs.count }}" or 0)
          after = d['count']
          plans = sum(1 for x in d['documents'] if x['classification_status'] == '정책계획서')
          offices = len(d['offices'])
          print(f"문서 {before} → {after} · 정책계획서 {plans} · 교육청 {offices}곳")

          logs = d.get('logs', [])
          fails = [l for l in logs if l.get('status') == '실패']

          # 파서가 살아 있는지는 '이번 실행에서 목록에서 읽어낸 글 수'로만 알 수 있다.
          # 총 문서 수는 병합이라, 모든 수집기가 깨져 한 건도 못 읽어도 그대로 유지된다.
          # 예전 가드는 그 총량만 봐서 몇 달째 아무것도 못 모아도 매일 성공으로 표시됐다.
          ran = [l for l in logs if 'fetched_count' in l]
          dead = [l for l in ran if l.get('fetched_count', 0) == 0]
          fetched = sum(l.get('fetched_count', 0) for l in ran)

          if fails:
              print(f"::warning::수집 실패 게시판 {len(fails)}개: " +
                    ", ".join(l['board_id'] for l in fails[:10]))
          if dead:
              print(f"::warning::목록을 한 건도 못 읽은 게시판 {len(dead)}개(파서 점검 대상): " +
                    ", ".join(l['board_id'] for l in dead[:10]))

          # ① 이번 실행이 사실상 아무것도 못 읽었다면 즉시 실패.
          if ran and fetched == 0:
              print("::error::이번 실행에서 어떤 게시판에서도 글을 읽지 못했습니다. 전면 파서 점검 필요")
              sys.exit(1)

          # ② 못 읽은 게시판이 너무 많으면 실패.
          #    평소 0건 게시판은 7% 안팎(글이 없는 게시판)이라 40%를 경계로 둔다.
          bad = len(dead) + len(fails)
          if len(ran) >= 20 and bad > len(ran) * 0.4:
              print(f"::error::{len(ran)}개 중 {bad}개 게시판이 글을 못 읽었습니다(40% 초과). 파서 점검 필요")
              sys.exit(1)

          # ③ 문서가 크게 줄었다면 실패(설정 사고·대량 삭제 감지용).
          if before > 100 and after < before * 0.8:
              print(f"::error::문서 급감: {before} → {after} (20% 이상 감소). 설정 변경을 확인하세요")
              sys.exit(1)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f"## 수집 결과\n\n"
                      f"- 문서: **{before} → {after}**\n"
                      f"- 이번에 읽은 글: **{fetched}건** (게시판 {len(ran)}개)\n"
                      f"- 정책계획서: **{plans}건**\n"
                      f"- 교육청: **{offices}곳** / 게시판 {d['coverage']['boards']}개\n"
                      f"- 실패 게시판: {len(fails)}개 / 한 건도 못 읽은 게시판: {len(dead)}개\n")
          PY

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/documents.json data/infolist.json; then
            echo "변경 없음"
            exit 0
          fi
          git add data/documents.json data/infolist.json
          git commit -m "chore: 정책계획·내부결재 계획 수집 ($(TZ=Asia/Seoul date '+%Y-%m-%d'))"
          # 다른 워크플로(게시판 재발견 등)가 먼저 푸시했을 수 있으므로
          # rebase 후 재시도한다. 수집 결과는 이미 커밋돼 있어 유실되지 않는다.
          for i in 1 2 3; do
            if git push; then
              echo "푸시 성공"
              exit 0
            fi
            echo "푸시 충돌 — 원격 변경분을 가져와 재시도 ($i/3)"
            git pull --rebase --autostash origin main || git rebase --abort
            sleep 5
          done
          echo "::error::3회 시도 후에도 푸시 실패"
          exit 1
