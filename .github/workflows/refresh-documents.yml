name: Refresh policy documents

# 각 교육청 계획 게시판을 매일 1회 수집 + 수동 실행
on:
  schedule:
    - cron: "0 20 * * *"   # 매일 05:00 KST
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Collect documents (전문 수집, 첨부 포함)
        run: python3 scripts/collect_documents.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/documents.json; then
            git add data/documents.json
            git commit -m "chore: refresh policy documents"
            git push
          else
            echo "변경 없음"
          fi
