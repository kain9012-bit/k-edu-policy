name: 게시판 재발견 (주간)

# 교육청 홈페이지 전체를 훑어 '계획이 쌓이는 게시판' 목록을 다시 만든다.
# - 새 게시판 신설 / 조직개편 / 게시판 폐지에 자동 대응
# - 매일 하기엔 무겁고 서버에도 부담이라 주 1회(일요일 새벽)로 둔다.
on:
  schedule:
    - cron: "0 19 * * 0"     # 일요일 04:00 KST (19:00 UTC 토)
  workflow_dispatch:
    inputs:
      office:
        description: "특정 교육청만 재발견 (비우면 어댑터 전체). 예: seoul, chungbuk"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: discover-boards
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # 사이트 전수 스캔은 오래 걸린다

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 재발견 전 게시판 수
        id: before
        run: |
          python - <<'PY' >> $GITHUB_OUTPUT
          import json, os
          p = 'config/boards_auto.json'
          n = len(json.load(open(p, encoding='utf-8'))['boards']) if os.path.exists(p) else 0
          print(f"count={n}")
          PY

      - name: 게시판 재발견
        run: |
          if [ -n "${{ inputs.office }}" ]; then
            python scripts/discover_boards.py "${{ inputs.office }}"
          else
            python scripts/discover_boards.py
          fi

      - name: 결과 요약 (신설/폐지 게시판)
        run: |
          python - <<'PY'
          import json, os, subprocess
          new = json.load(open('config/boards_auto.json', encoding='utf-8'))['boards']
          before = int("${{ steps.before.outputs.count }}" or 0)
          print(f"자동발견 게시판: {before} → {len(new)}")

          # 직전 커밋과 비교해 신설/제거 게시판 표시
          try:
              old_raw = subprocess.run(
                  ['git', 'show', 'HEAD:config/boards_auto.json'],
                  capture_output=True, text=True, check=True).stdout
              old_ids = {b['id'] for b in json.loads(old_raw)['boards']}
          except Exception:
              old_ids = set()
          new_ids = {b['id'] for b in new}
          added, removed = new_ids - old_ids, old_ids - new_ids
          if added:
              print(f"::notice::신설 게시판 {len(added)}개: " + ", ".join(sorted(added)[:10]))
          if removed:
              print(f"::warning::사라진 게시판 {len(removed)}개: " + ", ".join(sorted(removed)[:10]))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f"## 게시판 재발견\n\n- 게시판: **{before} → {len(new)}**\n"
                      f"- 신설: {len(added)}개 / 사라짐: {len(removed)}개\n")
          PY

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- config/boards_auto.json; then
            echo "게시판 변경 없음"
            exit 0
          fi
          git add config/boards_auto.json
          git commit -m "chore: 게시판 재발견 ($(TZ=Asia/Seoul date '+%Y-%m-%d'))"
          # 다른 워크플로가 먼저 푸시했을 수 있으므로 rebase 후 재시도
          for i in 1 2 3; do
            if git push; then
              echo "푸시 성공"
              exit 0
            fi
            echo "푸시 충돌 — 원격 변경분을 가져와 재시도 ($i/3)"
            git pull --rebase --autostash origin main || git rebase --abort
            sleep 5
          done
          echo "::error::3회 시도 후에도 푸시 실패"
          exit 1
