name: Refresh budget data

# 세출예산은 연 단위 갱신 → 매월 한 번 + 수동 실행
on:
  schedule:
    - cron: "0 21 1 * *"   # 매월 2일 06:00 KST (1일 21:00 UTC)
  workflow_dispatch:

# 봇이 data/budget.json 을 커밋한다. 이 권한이 없으면 push가 403으로 조용히 실패한다.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect budget data
        env:
          EDUINFO_KEY: ${{ secrets.EDUINFO_KEY }}
        run: python3 scripts/collect_budget.py --years 2022 2023 2024 2025 2026
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/budget.json; then
            git add data/budget.json
            git commit -m "chore: refresh budget data"
            git push
          else
            echo "변경 없음"
          fi
